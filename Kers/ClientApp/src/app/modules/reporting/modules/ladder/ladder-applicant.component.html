@if (loading) {
  <loading></loading>
}
@if (!loading) {
  <div>
    @if (newApplication) {
      <ladder-application-form (onFormCancel)="canceled()" (onDraftSaved)="submitted($event)" (onFormSubmit)="submitted($event)"></ladder-application-form>
    }
    @if (!newApplication) {
      <ladder-applicant-list-detail [application]="application"></ladder-applicant-list-detail>
    }
  </div>
}
