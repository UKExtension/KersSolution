<div>
  <div class="text-right">
    @if (!newContact) {
      <a class="btn btn-info btn-xs" (click)="newContact = true">+ new statistical contact</a>
    }
  </div>
  @if (newContact) {
    <contact-form [fiscalYearSwitcher]="false" (onFormCancel)="newContact=false" (onFormSubmit)="newContactSubmitted($event)"></contact-form>
  }
</div>
<br><contact-list [byMonth]="byMonth" (onDeleted)="deleted($event)" (onUpdated)="updated($event)"></contact-list>
@if (numbContacts != 0) {
  <div class="text-center">
    <div>Showing {{latest.length}} of {{numbContacts}} statistical contacts records</div>
    @if (latest.length < numbContacts) {
      <div class="btn btn-app" style="width: 97%; margin-right: 35px;" (click)="loadMore()">
        load more <span class="glyphicon glyphicon-chevron-down" aria-hidden="true"></span>
      </div>
    }
  </div>
}
