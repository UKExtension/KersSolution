<div>
  <div class="text-right">
    @if (!newExempt) {
      <a class="btn btn-info btn-xs" (click)="newExempt=!newExempt">+ new tax exempt entity</a>
    }
  </div>
  @if (newExempt) {
    <exempt-form (onFormCancel)="newExempt=!newExempt" (onFormSubmit)="onExemptUpdate()"></exempt-form>
  }
</div>
@if (exempts$) {
  <div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Entity Name</th>
          <th>CES Program Area(s)</th>
          <th>Record Last Updated</th>
          <th>Financial Year</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (exempt of exempts$ | async; track exempt) {
          <tr [exempt-list-detail]="exempt" (onExemptUpdated)="onExemptUpdate()" (onExemptDeleted)="onExemptUpdate()" ></tr>
        }
      </tbody>
    </table>
  </div>
}
