@if (!details) {
  <td>{{revision.revision.activityDate  | date:'shortDate'}}</td>
}
@if (!details) {
  <td>{{revision.user.rprtngProfile.name}}</td>
}
@if (!details) {
  <td>{{revision.unit.name}}</td>
}
@if (!details) {
  <td>{{revision.revision.title}}</td>
}
@if (!details) {
  <td><a class="btn btn-info btn-xs" (click)="details=true">details</a></td>
}
@if (details) {
  <td colspan="5">
    <div>
      <a class="btn btn-info btn-xs pull-right" (click)="details=false">close</a>
    </div>
    <service-log-full-details [activityId]="revision.revision.activityId"></service-log-full-details>
  </td>
}
