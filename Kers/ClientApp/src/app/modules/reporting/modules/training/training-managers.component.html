<h2>Session Managers List</h2>
<table class="table">
  @for (trainer of trainiers | async; track trainer) {
    <tr>
      <td>@if (trainer.personalProfile) {
        <span>{{trainer.personalProfile.firstName}} {{trainer.personalProfile.lastName}}</span>
      }</td>
      <td>{{trainer.rprtngProfile.planningUnit.name}}</td>
      <td>{{trainer.rprtngProfile.email}}</td>
    </tr>
  }
</table>
