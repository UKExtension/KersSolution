@if (rowOppened) {
  <td>{{help.id}}</td>
}
@if (rowOppened) {
  <td>{{help.title}}</td>
}
@if (rowOppened) {
  <td class="text-right" >
    <button (click)="edit()" class="btn btn-info btn-xs">edit</button>
    <button (click)="delete()" class="btn btn-info btn-xs">delete</button>
    @if (errorMessage) {
      <span>{{errorMessage}}</span>
    }
  </td>
}

@if (editOppened) {
  <td colspan="2">
    <help-form [help]="help" (onFormCancel)="close()" (onFormSubmit)="helpUpdated($event)"></help-form>
  </td>
}
@if (editOppened) {
  <td class="text-right" >
    <button (click)="close()" class="btn btn-info btn-xs">close</button>
  </td>
}
@if (deleteOppened) {
  <td colspan="2">Do you really want to delete help content {{help.title}}?<br><button (click)="confirmDelete()" class="btn btn-info btn-xs">Yes</button> <button (click)="close()" class="btn btn-info btn-xs">No</button></td>
}
@if (deleteOppened) {
  <td class="text-right" >
    <button (click)="close()" class="btn btn-info btn-xs">close</button>
  </td>
}
