@if (rowOppened) {
  <td>{{program.name}}</td>
}
@if (rowOppened) {
  <td>{{program.pacCode}}</td>
}
@if (rowOppened) {
  <td class="text-right" >
    <button (click)="edit()" class="btn btn-info btn-xs">edit</button>
    <button (click)="delete()" class="btn btn-info btn-xs">delete</button>
    @if (errorMessage) {
      <span>{{errorMessage}}</span>
    }
  </td>
}

@if (editOppened) {
  <td colspan="2">
    <program-form [program]="program" (onFormCancel)="close()" (onFormSubmit)="programUpdated(event)"></program-form>
  </td>
}
@if (editOppened) {
  <td class="text-right" >
    <button (click)="close()" class="btn btn-info btn-xs">close</button>
  </td>
}
@if (deleteOppened) {
  <td colspan="2">Do you really want to delete Major Program {{program.name}}?<br><button (click)="confirmDelete()" class="btn btn-info btn-xs">Yes</button> <button (click)="close()" class="btn btn-info btn-xs">No</button></td>
}
@if (deleteOppened) {
  <td class="text-right" >
    <button (click)="close()" class="btn btn-info btn-xs">close</button>
  </td>
}
