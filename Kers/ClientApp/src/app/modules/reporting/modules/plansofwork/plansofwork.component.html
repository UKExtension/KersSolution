<div>
  <div class="text-right">
    @if (!newPlan && plans != null && plans.length < 4) {
      <a class="btn btn-info btn-xs" (click)="newPlanofworkOpen()">+ new county emphasis</a>
    }
  </div>
  @if (newPlan) {
    <planofwork-form (onFormCancel)="newPlanofworkCancelled()" (onFormSubmit)="newPlanofworkSubmitted()" [fiscalYear]="fy"></planofwork-form>
  }
</div>
@if (plans) {
  <div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>County Emphases</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (planofwork of plans; track planofwork) {
          <tr [planofworkDetail]="planofwork" (onPlanofworkUpdated)="onPlanofworkUpdate()" (onPlanofworkDeleted)="onPlanofworkUpdate()" ></tr>
        }
      </tbody>
    </table>
  </div>
}
