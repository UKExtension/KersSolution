@if (loading) {
  <loading [type]="'bars'"></loading>
}
@if (!loading) {
  <div>
    @if (!evnt) {
      <p>
        <a class="btn btn-default" (click)="convert()">convert</a>
        {{s.eventDateBegin}} - {{s.eventTitle}}
      </p>
    }
    @if (evnt) {
      <p >
        converted {{evnt.start}} - {{evnt.subject}}
      </p>
    }
  </div>
}
