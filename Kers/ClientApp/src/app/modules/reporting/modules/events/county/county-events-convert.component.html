
Convert<div><a class="btn btn-default" (click)="reload()">Reload</a></div>
@if (services$ | async; as services) {
  <div >
    <div [hidden]="services.length != items.length && !this.convertAllClicked && convertedItemIndex <= items.length">
      <a class="btn btn-default" (click)="convertAll()">Convert All</a><br><br>
    </div>
    <div [hidden]="convertedItemIndex <= items.length">Reload</div>
    @for (s of services; track s) {
      <county-events-convert-item (onLoaded)="addItem($event)" (onConverted)="addTraining($event)" [service]="s"></county-events-convert-item>
    }
  </div>
}
