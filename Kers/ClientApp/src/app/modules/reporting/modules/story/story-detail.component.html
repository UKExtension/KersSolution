<div class="ln_solid"></div>
<div class="row">
  <div class="col-xs-10">

    @if (rowDefault) {
      <article class="media event">
        <div class="media-body">
          <a class="title">{{story.title}}</a>
          <p></p>
        </div>
      </article>
    }
    @if (rowEdit) {
      <div class="col-xs-12">
        <story-form [story]="story" (onFormCancel)="default()" (onFormSubmit)="storySubmitted($event)"></story-form>
      </div>
    }
    @if (rowDelete) {
      <div class="col-xs-11">
        Do you really want to delete story <strong>{{story.title}}</strong>?<br><button (click)="confirmDelete()" class="btn btn-info btn-xs">Yes</button> <button (click)="default()" class="btn btn-info btn-xs">No</button>
      </div>
    }

  </div>
  @if (displayEditButtons) {
    <div class="col-xs-2 text-right">
      @if (rowDefault) {
        <a class="btn btn-info btn-xs" (click)="edit()">edit</a>
      }
      @if (rowDefault) {
        <a class="btn btn-info btn-xs" (click)="delete()">delete</a>
      }
      @if (!rowDefault) {
        <a class="btn btn-info btn-xs" (click)="default()">close</a>
      }
    </div>
  }
</div>
